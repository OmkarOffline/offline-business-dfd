<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Artium Academy — Offline Centres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--white:#FFFFFF;--alt:#F1F5F9;
  --border:#E2E8F0;--border-h:#CBD5E1;
  --r:20px;
  --h1:#17213C;--h2:#1E293B;--h3:#334155;
  --body:#475569;--sec:#64748B;--meta:#94A3B8;
  --dock-h:88px;
}
body{background:var(--bg);font-family:"Inter",sans-serif;color:var(--body);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}

/* ── MAIN CANVAS ── */
#canvas{
  position:fixed;top:0;left:0;right:0;bottom:var(--dock-h);
  overflow-y:auto;
  padding:0;
}
#canvas::-webkit-scrollbar{width:6px}
#canvas::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:6px}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.back-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:30px;
  border:1.5px solid var(--border-h);
  background:var(--white);cursor:pointer;
  font-size:12px;font-weight:600;color:var(--sec);
  transition:all .18s;white-space:nowrap;
  text-decoration:none;
}
.back-btn:hover{background:var(--alt);color:var(--h1);border-color:var(--h3)}
.back-btn i{font-size:14px}
.topbar-logo{
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:800;
  color:#17213C;letter-spacing:-.01em;
}
.topbar-logo span{color:#E8006A}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--meta)}
.bc-sep{color:var(--border-h);margin:0 2px}
.bc-part{cursor:pointer;font-weight:600;color:var(--sec);transition:color .15s;padding:2px 6px;border-radius:6px}
.bc-part:hover{color:var(--h1);background:var(--alt)}
.bc-part.active{color:var(--h1);font-weight:700}

/* Search */
.search-wrap{display:flex;align-items:center;gap:8px;position:relative}
.search-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--white);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--sec);font-size:16px;
  transition:all .2s;flex-shrink:0;
}
.search-btn:hover{border-color:var(--border-h);color:var(--h1)}
.search-input-wrap{
  overflow:hidden;width:0;
  transition:width .3s cubic-bezier(.4,0,.2,1);
}
.search-input-wrap.open{width:240px}
.search-input{
  width:240px;height:36px;border-radius:18px;
  border:1.5px solid var(--border-h);
  padding:0 16px;font-size:13px;color:var(--h1);
  outline:none;background:var(--white);
  font-family:"Inter",sans-serif;
  transition:border-color .18s;
}
.search-input:focus{border-color:#E8006A}
.search-results{
  position:absolute;top:44px;right:0;
  width:360px;
  background:var(--white);
  border:1.5px solid var(--border-h);
  border-radius:16px;
  box-shadow:0 16px 48px rgba(15,23,42,0.14);
  overflow:hidden;z-index:200;
  display:none;
}
.search-results.open{display:block}
.sr-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 16px;cursor:pointer;
  transition:background .15s;
  border-bottom:1px solid var(--border);
}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--alt)}
.sr-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.sr-info{flex:1;min-width:0}
.sr-name{font-family:"Manrope",sans-serif;font-size:13px;font-weight:700;color:var(--h1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-path{font-size:11px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-empty{padding:20px 16px;text-align:center;color:var(--meta);font-size:13px}

/* ── CONTENT AREA ── */
#content{padding:28px 32px 32px}

/* Home screen — no function selected */
.home-msg{
  position:relative;
  height:calc(100vh - var(--dock-h) - 69px);
  overflow:hidden;
  display:flex;align-items:flex-end;justify-content:flex-start;
}
.home-bg-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  display:block;
  opacity:1;
  transition:opacity 0.6s cubic-bezier(.4,0,.2,1);
}
.home-bg-img.dimmed{opacity:0.22}
.home-overlay-text{
  position:relative;z-index:2;
  padding:28px 40px;
  background:linear-gradient(90deg,rgba(245,235,220,0) 0%,transparent 100%);
  width:100%;
  opacity:1;
  transition:opacity 0.5s;
}
.home-overlay-text.hidden-text{opacity:0;pointer-events:none}
.home-overlay-title{
  font-family:"Manrope",sans-serif;
  font-size:28px;font-weight:900;
  color:#3A2C1A;letter-spacing:-.03em;
  margin-bottom:4px;
}
.home-overlay-sub{
  font-family:"Manrope",sans-serif;
  font-size:14px;font-weight:600;
  color:#6B5640;letter-spacing:.02em;
  margin-bottom:10px;
}
.home-overlay-hint{
  font-size:12px;color:#9B8060;font-weight:500;
  letter-spacing:.04em;
}

/* ── FOLDER GRID ── */
.folder-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}
.folder-card{
  background:var(--white);border:1.5px solid var(--border);
  border-radius:20px;padding:24px 20px 20px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s,border-color .2s;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.folder-card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 48px rgba(15,23,42,0.12);
  border-color:var(--border-h);
}
.folder-card:hover .fc-arrow{opacity:1;transform:translateX(2px)}
.fc-img{width:80px;height:80px;object-fit:contain;margin-bottom:14px}
.fc-name{font-family:"Manrope",sans-serif;font-size:14px;font-weight:700;color:var(--h1);line-height:1.35;margin-bottom:6px;letter-spacing:-.01em}
.fc-meta{font-size:11px;color:var(--meta);font-weight:500;margin-bottom:14px}
.fc-bar-bg{width:100%;height:4px;border-radius:4px;background:var(--alt);overflow:hidden;margin-bottom:8px}
.fc-bar-fill{height:4px;border-radius:4px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.fc-pct{font-family:"Manrope",sans-serif;font-size:11px;font-weight:700}
.fc-arrow{
  position:absolute;top:16px;right:16px;
  font-size:14px;color:var(--meta);opacity:0;
  transition:all .2s;
}

/* ── INITIATIVE FLOATING WINDOW ── */
.init-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(15,23,42,0.35);
  backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:32px;
}
.init-overlay.open{display:flex}
.init-window{
  width:min(720px,96vw);
  max-height:calc(100vh - 140px);
  background:var(--white);
  border-radius:24px;
  box-shadow:0 32px 80px rgba(15,23,42,0.22);
  display:flex;flex-direction:column;
  overflow:hidden;
  transform:scale(0.92) translateY(20px);opacity:0;
  transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .35s;
}
.init-overlay.open .init-window{transform:scale(1) translateY(0);opacity:1}
.init-win-hdr{
  padding:26px 32px 20px;
  border-bottom:1.5px solid var(--border);
  flex-shrink:0;position:relative;
}
.init-win-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:30px;
  font-family:"Manrope",sans-serif;font-size:11px;font-weight:700;
  margin-bottom:10px;letter-spacing:.02em;
}
.init-win-title{
  font-family:"Manrope",sans-serif;font-size:22px;font-weight:800;
  color:var(--h1);letter-spacing:-.03em;margin-bottom:14px;line-height:1.2;
}
.init-win-prog-row{display:flex;align-items:center;gap:12px}
.init-win-prog-bg{flex:1;height:6px;border-radius:6px;background:var(--alt);overflow:hidden}
.init-win-prog-fill{height:6px;border-radius:6px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.init-win-prog-lbl{font-family:"Manrope",sans-serif;font-size:13px;font-weight:800;min-width:44px;text-align:right}
.init-win-close{
  position:absolute;top:22px;right:24px;
  width:34px;height:34px;border-radius:50%;
  background:var(--alt);border:1.5px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--sec);font-size:15px;transition:all .18s;
}
.init-win-close:hover{background:var(--border-h);color:var(--h1)}
.init-win-body{
  flex:1;overflow-y:auto;padding:24px 32px 32px;
}
.init-win-body::-webkit-scrollbar{width:5px}
.init-win-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.init-section{margin-bottom:24px}
.init-section:last-child{margin-bottom:0}
.init-sec-lbl{
  font-family:"Manrope",sans-serif;
  font-size:13px;font-weight:800;
  letter-spacing:.04em;
  margin-bottom:14px;margin-top:4px;
  display:flex;align-items:center;gap:10px;
}
.init-sec-lbl::after{content:"";flex:1;height:1.5px;border-radius:2px;opacity:.25}
.init-sec-lbl.desired{color:#6366F1}
.init-sec-lbl.desired::after{background:#6366F1}
.init-sec-lbl.current{color:#D97706}
.init-sec-lbl.current::after{background:#D97706}
.init-sec-lbl.plan{color:#059669}
.init-sec-lbl.plan::after{background:#059669}
.init-item{
  display:flex;gap:10px;align-items:flex-start;
  margin-bottom:10px;
}
.init-item:last-child{margin-bottom:0}
.init-dot{width:5px;height:5px;border-radius:50%;margin-top:9px;flex-shrink:0}
.init-txt{font-size:13.5px;color:var(--body);line-height:1.75;font-weight:400}
.dep-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:20px;
  font-size:10px;font-weight:700;
  cursor:pointer;margin-left:6px;
  vertical-align:middle;flex-shrink:0;
}
.dep-tag.mo{background:rgba(245,158,11,0.12);color:#B45309;border:1px solid rgba(245,158,11,0.3)}
.dep-tag.ch{background:rgba(99,102,241,0.1);color:#4338CA;border:1px solid rgba(99,102,241,0.25)}

/* ── MACROS DOCK ── */
.dock-wrap{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--dock-h);
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  box-shadow:0 -8px 32px rgba(15,23,42,0.06);
}
.dock-inner{
  display:flex;align-items:center;gap:2px;
  padding:0 16px;
  height:100%;
}
.dock-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:6px 10px;border-radius:14px;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
  min-width:76px;position:relative;
}
.dock-item:hover{background:rgba(15,23,42,0.05);transform:translateY(-3px)}
.dock-item.active{background:rgba(15,23,42,0.06)}
.dock-item.active::after{
  content:"";position:absolute;bottom:-4px;
  left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;
  background:var(--dock-accent,#E8006A);
}
.dock-arc-wrap{position:relative;width:48px;height:48px;flex-shrink:0}
.dock-arc-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dock-arc-bg{fill:none;stroke:rgba(15,23,42,0.08);stroke-width:2.5;stroke-linecap:round}
.dock-arc-fill{fill:none;stroke-width:2.5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.dock-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;object-fit:contain;transition:transform .2s}
.dock-item:hover .dock-icon{transform:translate(-50%,-50%) scale(1.12)}
.dock-item.active .dock-icon{transform:translate(-50%,-50%) scale(1.08)}
.dock-label{
  font-size:9px;font-weight:600;color:var(--sec);
  text-align:center;line-height:1.2;
  max-width:70px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dock-item.active .dock-label{color:var(--h1);font-weight:700}

/* Tooltip on dock hover */
.dock-tooltip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--h1);color:#fff;font-size:11px;font-weight:600;
  padding:5px 10px;border-radius:8px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;
  box-shadow:0 4px 12px rgba(15,23,42,0.2);
}
.dock-tooltip::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--h1);
}
.dock-item:hover .dock-tooltip{opacity:1}

/* Section heading */
.section-heading{
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:700;
  color:var(--meta);letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:20px;
}

/* Tooltip global */
.tt{position:fixed;z-index:999;background:var(--h1);color:#fff;font-size:12px;font-weight:500;padding:7px 12px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .15s;max-width:280px;line-height:1.5;box-shadow:0 6px 20px rgba(15,23,42,0.2)}
.tt.on{opacity:1}
.tt::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--h1)}
</style>
</head>

<div class="tt" id="tt"></div>

  <div class="topbar">
    <div class="topbar-left">

let activeFnIdx = null;

// ── UTILS ──
const bC = p => p<=40 ? "#EF4444" : p<=70 ? "#F59E0B" : "#10B981";
const pT = p => p===100 ? "Complete" : p>0 ? p+"%" : "Not started";
function avgI(arr){return arr.length ? Math.round(arr.reduce((s,x)=>s+x.pct,0)/arr.length) : 0;}
function avgN(n){
  if(n.i && n.i.length) return avgI(n.i);
  const ch = n.kids || n.s || [];
  if(!ch.length) return 0;
  return Math.round(ch.map(c=>avgN(c)).reduce((a,b)=>a+b,0)/ch.length);
}
function mkFolderImg(size){
  const i = document.createElement("img");
  i.src = "data:image/png;base64,"+ICON_B64["folder"];
  i.style.cssText = `width:${size}px;height:${size}px;object-fit:contain`;
  return i;
}
function mkDockImg(key, color, pct){
  // Arc geometry
  const r = 21, cx = 24, cy = 24;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct/100);

  const wrap = document.createElement("div");
  wrap.className = "dock-arc-wrap";

  // SVG arc
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 48 48");

  const bgCirc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  bgCirc.setAttribute("cx",cx); bgCirc.setAttribute("cy",cy); bgCirc.setAttribute("r",r);
  bgCirc.setAttribute("class","dock-arc-bg");
  svg.appendChild(bgCirc);

  const fillCirc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  fillCirc.setAttribute("cx",cx); fillCirc.setAttribute("cy",cy); fillCirc.setAttribute("r",r);
  fillCirc.setAttribute("class","dock-arc-fill");
  fillCirc.style.stroke = color;
  fillCirc.style.strokeDasharray = circ;
  fillCirc.style.strokeDashoffset = circ; // start at 0, animate to offset
  fillCirc.dataset.offset = offset;
  svg.appendChild(fillCirc);

  wrap.appendChild(svg);

  // Icon img
  const img = document.createElement("img");
  img.src = "data:image/png;base64,"+ICON_B64[key];
  img.className = "dock-icon";
  wrap.appendChild(img);

  return wrap;
}

const ttEl = document.getElementById("tt");
let ttTimer;
function showTT(el,txt){
  clearTimeout(ttTimer);
  ttEl.textContent = txt; ttEl.classList.add("on");
  requestAnimationFrame(()=>{
    const r=el.getBoundingClientRect(), tw=ttEl.offsetWidth, th=ttEl.offsetHeight;
    let l=r.left+r.width/2-tw/2;
    l=Math.max(6,Math.min(l,window.innerWidth-tw-6));
    ttEl.style.left=l+"px"; ttEl.style.top=(r.top-9-th)+"px";
  });
}
function hideTT(){ttTimer=setTimeout(()=>ttEl.classList.remove("on"),100);}

  const bg = document.querySelector(".home-bg-img");
  const overlay = document.querySelector(".home-overlay-text");

  if(overlay) overlay.classList.toggle("hidden-text", dim);
}

function renderBackBtn(fi){
  // Remove existing back btn if any
  const existing = document.getElementById("back-nav-btn");
  if(existing) existing.remove();

  const topbarLeft = document.querySelector(".topbar-left");
  if(!topbarLeft) return;

  const btn = document.createElement("button");
  btn.className = "back-btn";
  btn.id = "back-nav-btn";
  btn.innerHTML = '<i class="ti ti-arrow-left"></i> Back';
  btn.addEventListener("click", ()=>{
    if(navStack.length > 0){
      navStack.pop();
      if(navStack.length === 0){
        // Back to function root
        renderLevel(D[fi].s||[], D[fi].n, fi);
      } else {
        const prev = navStack[navStack.length-1];
        navStack.pop();
        if(prev.isInitList){
          renderInitList(prev.children, prev.label, fi);
        } else {
          renderLevel(prev.children, prev.label, fi);
        }
      }
    } else {
      // Back to home
      activeFnIdx = null;
      setActiveDock(-1);
      document.getElementById("content").innerHTML = "";
      const homemsg = document.createElement("div");

function buildDock(){
  const inner = document.getElementById("dock-inner");
  inner.innerHTML = "";
  D.forEach((fn,fi)=>{
    const c = C[fn.k];
    const pct = avgN(fn);
    const item = document.createElement("div");
    item.className = "dock-item";
    item.style.setProperty("--dock-accent", c.a);
    item.dataset.fi = fi;

    const tip = document.createElement("div");
    tip.className = "dock-tooltip";
    tip.textContent = fn.n + " · " + (pct > 0 ? pct+"%" : "Not started");
    item.appendChild(tip);

    item.appendChild(mkDockImg(fn.k, c.a, pct));

    const lbl = document.createElement("div");
    lbl.className = "dock-label";
    lbl.textContent = fn.n;
    item.appendChild(lbl);

    item.addEventListener("click", ()=>selectFn(fi));
    inner.appendChild(item);
  });

  // Animate arcs after a short delay
  setTimeout(()=>{
    document.querySelectorAll(".dock-arc-fill").forEach(el=>{
      el.style.strokeDashoffset = el.dataset.offset;
    });
  }, 200);
}

function setActiveDock(fi){
  document.querySelectorAll(".dock-item").forEach((el,i)=>{
    el.classList.toggle("active", i===fi);
  });
}

// ── FUNCTION SELECTION ──
function selectFn(fi){
  activeFnIdx = fi;
  navStack = [];
  setActiveDock(fi);
  const fn = D[fi];
  renderLevel(fn.s || [], fn.n, fi);
}

// ── BREADCRUMB ──
function renderBreadcrumb(){
  const bc = document.getElementById("breadcrumb");
  bc.innerHTML = "";
  if(activeFnIdx===null) return;
  const fn = D[activeFnIdx];

  const root = document.createElement("span");
  root.className = "bc-part";
  root.textContent = fn.n;
  root.onclick = ()=>{ navStack=[]; renderLevel(fn.s||[], fn.n, activeFnIdx); };
  bc.appendChild(root);

  navStack.forEach((entry,i)=>{
    const sep = document.createElement("span");
    sep.className = "bc-sep"; sep.textContent = "›";
    bc.appendChild(sep);
    const part = document.createElement("span");
    part.className = "bc-part" + (i===navStack.length-1?" active":"");
    part.textContent = entry.label;
    const capturedI = i;
    part.onclick = ()=>{
      navStack = navStack.slice(0, capturedI+1);
      const target = navStack[capturedI];
      renderLevel(target.children, target.label, activeFnIdx);
      navStack = navStack.slice(0, capturedI);
    };
    bc.appendChild(part);
  });
}

// ── RENDER LEVEL ──
function renderLevel(nodes, label, fi){
  const c = C[D[fi].k];
  const content = document.getElementById("content");
  content.innerHTML = "";
  document.getElementById("home-msg") && document.getElementById("home-msg").remove();

  renderBreadcrumb();
  renderBackBtn(fi);

  if(!nodes || !nodes.length){
    content.innerHTML = `<div style="text-align:center;padding:80px 20px;color:var(--meta);font-size:14px;line-height:1.8">
      <div style="font-size:40px;margin-bottom:16px;opacity:.2">📋</div>
      Brief coming soon.<br>Sub-functions and initiatives will appear here once briefed.
    </div>`;
    return;
  }

  const heading = document.createElement("div");
  heading.className = "section-heading";
  heading.textContent = label;
  content.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "folder-grid";

  nodes.forEach(node=>{
    const pct = avgN(node);
    const card = document.createElement("div");
    card.className = "folder-card";

    const arr = document.createElement("i");
    arr.className = "ti ti-arrow-right fc-arrow";
    card.appendChild(arr);

    const img = mkFolderImg(80);
    img.className = "fc-img";
    card.appendChild(img);

    const nm = document.createElement("div");
    nm.className = "fc-name";
    nm.textContent = node.n;
    card.appendChild(nm);

    const meta = document.createElement("div");
    meta.className = "fc-meta";
    const childCount = (node.kids||[]).length + (node.s||[]).length + (node.i||[]).length;
    meta.textContent = node.i && node.i.length
      ? node.i.length+" initiative"+(node.i.length>1?"s":"")
      : (node.kids||node.s) ? ((node.kids||node.s).length)+" sub-section"+((node.kids||node.s).length!==1?"s":"")
      : "Coming soon";
    card.appendChild(meta);

    const barBg = document.createElement("div"); barBg.className = "fc-bar-bg";
    const barFill = document.createElement("div"); barFill.className = "fc-bar-fill";
    barFill.style.cssText = `width:0;background:${bC(pct)}`;
    barFill.dataset.v = pct;
    barBg.appendChild(barFill); card.appendChild(barBg);

    const pctEl = document.createElement("div"); pctEl.className = "fc-pct";
    pctEl.style.color = bC(pct); pctEl.textContent = pT(pct);
    card.appendChild(pctEl);

    // Hover colour accent
    card.addEventListener("mouseenter",()=>{
      card.style.borderColor = c.a+"50";
      card.style.boxShadow = `0 20px 48px ${c.a}18`;
    });
    card.addEventListener("mouseleave",()=>{
      card.style.borderColor=""; card.style.boxShadow="";
    });

    card.addEventListener("click",()=>{
      if(node.i && node.i.length){
        // Leaf — open initiative list or single init
        if(node.i.length===1){
          openInit(node.i[0], node.n, fi);
        } else {
          navStack.push({label:node.n, children:node.i, isInitList:true});
          renderInitList(node.i, node.n, fi);
        }
      } else {
        const children = node.kids || node.s || [];
        navStack.push({label:node.n, children:children});
        renderLevel(children, node.n, fi);
      }
    });

    grid.appendChild(card);
  });

  content.appendChild(grid);
  setTimeout(()=>grid.querySelectorAll("[data-v]").forEach(el=>el.style.width=el.dataset.v+"%"),80);
  dimBackground(true);
}

// ── RENDER INITIATIVE LIST ──
function renderInitList(inits, label, fi){
  const c = C[D[fi].k];
  const content = document.getElementById("content");
  content.innerHTML = "";
  renderBreadcrumb();
  renderBackBtn(fi);

  const heading = document.createElement("div");
  heading.className = "section-heading";
  heading.textContent = label;
  content.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "folder-grid";

  inits.forEach(init=>{
    const card = document.createElement("div");
    card.className = "folder-card";

    const arr = document.createElement("i");
    arr.className = "ti ti-arrow-right fc-arrow";
    card.appendChild(arr);

    // Use a document icon instead of folder
    const ico = document.createElement("div");
    ico.style.cssText = `font-size:52px;margin-bottom:14px`;
    ico.textContent = "📄";
    card.appendChild(ico);

    const nm = document.createElement("div");
    nm.className = "fc-name"; nm.textContent = init.n;
    card.appendChild(nm);

    const barBg = document.createElement("div"); barBg.className = "fc-bar-bg";
    const barFill = document.createElement("div"); barFill.className = "fc-bar-fill";
    barFill.style.cssText = `width:0;background:${bC(init.pct)}`;
    barFill.dataset.v = init.pct;
    barBg.appendChild(barFill); card.appendChild(barBg);

    const pctEl = document.createElement("div"); pctEl.className = "fc-pct";
    pctEl.style.color = bC(init.pct); pctEl.textContent = pT(init.pct);
    card.appendChild(pctEl);

    card.addEventListener("mouseenter",()=>{ card.style.borderColor=c.a+"50"; });
    card.addEventListener("mouseleave",()=>{ card.style.borderColor=""; });
    card.addEventListener("click",()=>openInit(init, init.n, fi));

    grid.appendChild(card);
  });

  content.appendChild(grid);
  setTimeout(()=>grid.querySelectorAll("[data-v]").forEach(el=>el.style.width=el.dataset.v+"%"),80);
  dimBackground(true);
}

// ── INITIATIVE WINDOW ──
function openInit(init, parentName, fi){
  const c = C[D[fi].k];
  const chip = document.getElementById("iw-chip");
  chip.textContent = D[fi].n;
  chip.style.cssText = `background:${c.bg};color:${c.pc};border:1.5px solid ${c.a}30;font-family:Manrope,sans-serif`;

  document.getElementById("iw-title").textContent = init.n;

  const prog = document.getElementById("iw-prog");
  prog.style.background = bC(init.pct);
  setTimeout(()=>prog.style.width=init.pct+"%", 60);

  const pctEl = document.getElementById("iw-pct");
  pctEl.textContent = pT(init.pct);
  pctEl.style.color = bC(init.pct);

  const body = document.getElementById("iw-body");
  body.innerHTML = "";

  // Dependency tags
  let depHtml = "";
  if(init.rb && init.rb.length){
    depHtml += init.rb.map(id=>{
      const d=DEPS[id];
      return `<span class="dep-tag mo" title="${d?d.lbl:id}"><i class="ti ti-crown"></i> ${d?d.lbl:id}</span>`;
    }).join("");
  }
  if(init.do && init.do.length){
    depHtml += init.do.map(id=>{
      const d=DEPS[id];
      return `<span class="dep-tag ch" title="${d?d.lbl:id}"><i class="ti ti-git-branch"></i> ${d?d.lbl:id}</span>`;
    }).join("");
  }
  if(depHtml){
    const depRow = document.createElement("div");
    depRow.style.cssText = "margin-bottom:18px;display:flex;flex-wrap:wrap;gap:6px;";
    depRow.innerHTML = depHtml;
    body.appendChild(depRow);
  }

  const sections = [
    {key:"ds", label:"Desired State", cls:"desired", dot:"#6366F1"},
    {key:"cs", label:"Current State", cls:"current", dot:"#F59E0B"},
    {key:"pa", label:"Plan Ahead",    cls:"plan",    dot:"#10B981"},
  ];

  sections.forEach(sec=>{
    const items = init[sec.key];
    if(!items || !items.length) return;
    const wrap = document.createElement("div");
    wrap.className = "init-section";
    const lbl = document.createElement("div");
    lbl.className = `init-sec-lbl ${sec.cls}`;
    lbl.textContent = sec.label;
    wrap.appendChild(lbl);
    items.forEach(txt=>{
      const row = document.createElement("div");
      row.className = "init-item";
      const dot = document.createElement("div");
      dot.className = "init-dot";
      dot.style.background = sec.dot;
      const t = document.createElement("div");
      t.className = "init-txt"; t.textContent = txt;
      row.appendChild(dot); row.appendChild(t);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  });

  document.getElementById("init-overlay").classList.add("open");
  document.getElementById("iw-prog").style.width = "0";
  setTimeout(()=>document.getElementById("iw-prog").style.width=init.pct+"%", 80);
}

function closeInit(){
  document.getElementById("init-overlay").classList.remove("open");
}
function handleOverlayClick(e){
  if(e.target===document.getElementById("init-overlay")) closeInit();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeInit();});

// ── SEARCH ──
let searchOpen = false;
function toggleSearch(){
  searchOpen = !searchOpen;
  document.getElementById("search-wrap").classList.toggle("open", searchOpen);
  const sr = document.getElementById("search-results");
  if(searchOpen){
    document.getElementById("search-input").focus();
  } else {
    document.getElementById("search-input").value = "";
    sr.classList.remove("open");
    sr.innerHTML = "";
  }
}

function getAllSearchable(){
  const results = [];
  function walk(node, path, fi){
    const nodePath = [...path, node.n];
    if(node.i && node.i.length){
      node.i.forEach(init=>{
        results.push({
          type:"initiative", name:init.n, path:nodePath, fi, init,
          searchText:[init.n, ...(init.ds||[]), ...(init.cs||[]), ...(init.pa||[])].join(" ").toLowerCase()
        });
      });
    }
    const children = node.kids || node.s || [];
    children.forEach(c=>walk(c, nodePath, fi));
    // Also add the node itself if no inits
    if(!node.i || !node.i.length){
      results.push({
        type:"node", name:node.n, path, fi, node,
        searchText: node.n.toLowerCase()
      });
    }
  }
  D.forEach((fn,fi)=>{
    results.push({type:"fn", name:fn.n, path:[], fi, searchText:fn.n.toLowerCase()});
    (fn.s||[]).forEach(s=>walk(s,[fn.n],fi));
  });
  return results;
}

function scoreMatch(item, q){
  const name = item.name.toLowerCase();
  if(name === q) return 100;
  if(name.startsWith(q)) return 80;
  if(name.includes(q)) return 60;
  if(item.searchText.includes(q)) return 30;
  return 0;
}

function onSearch(){
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  const sr = document.getElementById("search-results");
  if(!q){ sr.classList.remove("open"); sr.innerHTML=""; return; }

  const all = getAllSearchable();
  const scored = all.map(item=>({...item, score:scoreMatch(item,q)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,8);

  if(!scored.length){
    sr.innerHTML=`<div class="sr-empty">No results for "<strong>${q}</strong>"</div>`;
    sr.classList.add("open");
    return;
  }

  sr.innerHTML="";
  scored.forEach(item=>{
    const el=document.createElement("div");
    el.className="sr-item";
    const ico=document.createElement("div"); ico.className="sr-icon";
    ico.textContent = item.type==="initiative" ? "📄" : item.type==="fn" ? "🏢" : "📁";
    const info=document.createElement("div"); info.className="sr-info";
    const nm=document.createElement("div"); nm.className="sr-name"; nm.textContent=item.name;
    const pth=document.createElement("div"); pth.className="sr-path";
    pth.textContent = item.path.join(" › ") || D[item.fi].n;
    info.appendChild(nm); info.appendChild(pth);
    el.appendChild(ico); el.appendChild(info);
    el.addEventListener("click",()=>navigateTo(item));
    sr.appendChild(el);
  });
  sr.classList.add("open");
}

function onSearchKey(e){
  if(e.key==="Escape") toggleSearch();
}

function navigateTo(item){
  toggleSearch();
  activeFnIdx = item.fi;
  navStack = [];
  setActiveDock(item.fi);

  if(item.type==="fn"){
    renderLevel(D[item.fi].s||[], D[item.fi].n, item.fi);
  } else if(item.type==="initiative"){
    const fn=D[item.fi];
    renderLevel(fn.s||[], fn.n, item.fi);
    setTimeout(()=>openInit(item.init, item.init.n, item.fi), 200);
  } else {
    renderLevel(D[item.fi].s||[], D[item.fi].n, item.fi);
  }
}

// Close search on outside click
document.addEventListener("click",e=>{
  if(searchOpen && !e.target.closest(".search-wrap")){
    toggleSearch();
  }
});

// ── INIT ──
buildDock();

</script>
